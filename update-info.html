<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update My Info — Vortex Productions</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --accent1:#d92b2b; --accent2:#ff8c00; --accent3:#ffd23f; --accent4:#2f7ec9; --accent5:#123a63;
    --ink:#f4f1ea; --ink-soft:#a3a9bf; --line:rgba(255,255,255,0.1);
    --card:rgba(22,28,48,0.75); --ok:#4caf7d; --err:#ff6a5a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #16233f 0%, #0a0f1e 55%, #05070f 100%);
    color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:32px 16px;
  }
  .wrap{max-width:440px;width:100%;}
  .back-link{
    display:block; margin:0 0 12px; padding:0 4px;
    font-size:12.5px; color:var(--ink-soft); text-decoration:none;
  }
  .back-link:hover{color:#ffb98a;}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
    backdrop-filter:blur(6px);
  }
  header{
    background:rgba(10,14,26,0.5); color:var(--ink);
    padding:22px 24px; border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg,var(--accent1),var(--accent2) 35%,var(--accent3) 55%,var(--accent4) 80%,var(--accent5)) 1;
    display:flex; align-items:center; gap:14px;
  }
  header img{width:44px;height:44px;flex-shrink:0;border-radius:8px;background:#fff;}
  header .kicker{font-size:11px;letter-spacing:.08em;color:#ffb98a;margin:0 0 4px;font-weight:700;text-transform:uppercase;}
  header h1{margin:0;font-size:19px;font-weight:700;line-height:1.3;}
  .body{padding:24px;}
  p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 20px;line-height:1.5;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
  label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  input[type=text]{
    font-size:15px;padding:10px 12px;border:1px solid var(--line);
    border-radius:6px;background:rgba(10,14,26,0.6);color:var(--ink);
  }
  input:focus{outline:none;border-color:#ff8c00;box-shadow:0 0 0 2px rgba(255,140,0,0.2);}
  input[readonly]{background:rgba(255,255,255,0.04);color:var(--ink-soft);}
  button.primary{
    width:100%; color:#fdf6f2; border:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    font-size:15px; font-weight:700; padding:13px 16px; border-radius:8px; cursor:pointer;
    box-shadow:0 0 18px rgba(255,140,0,0.3);
  }
  button.primary:hover{filter:brightness(1.1);}
  .photo-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:1px solid var(--line); color:var(--ink);
    font-size:13px; padding:9px 14px; border-radius:8px; cursor:pointer;
  }
  .photo-btn:hover{border-color:#ffb98a;}
  .msg{font-size:13px;margin-top:14px;text-align:center;}
  .msg.ok{color:var(--ok);}
  .msg.err{color:var(--err);}
  .success{padding:36px 24px;text-align:center;}
  .success .check{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--ok),#2f7ec9);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:28px;margin:0 auto 16px;
    box-shadow:0 0 20px rgba(76,175,125,0.4);
  }
  .success h2{margin:0 0 6px;font-size:18px;color:var(--ink);}
  .success p{margin:0;color:var(--ink-soft);font-size:13.5px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to main menu</a>
  <div class="card">
    <header>
      <img src="logo.jpg" alt="Vortex Fireworks Artists logo">
      <div>
        <p class="kicker">VORTEX PRODUCTIONS INC.</p>
        <h1>Update My Info</h1>
      </div>
    </header>

    <div class="body" id="verifyStep">
      <p class="sub">Enter your name and the phone number already on file to pull up your info and make changes.</p>
      <div class="field">
        <label for="vName">Your name</label>
        <input type="text" id="vName" list="namesList" autocomplete="off">
        <datalist id="namesList"></datalist>
      </div>
      <div class="field">
        <label for="vPhone">Phone number on file</label>
        <input type="text" id="vPhone">
      </div>
      <button class="primary" type="button" onclick="verifyIdentity()">Continue</button>
      <p class="msg" id="verifyMsg"></p>
    </div>

    <div class="body" id="editStep" style="display:none;">
      <p class="sub">Update anything below, then save.</p>
      <div class="field">
        <label for="eName">Name</label>
        <input type="text" id="eName" readonly>
      </div>
      <div class="field">
        <label for="ePhone">Phone number</label>
        <input type="text" id="ePhone">
      </div>
      <div class="field">
        <label for="eLicense">License number</label>
        <input type="text" id="eLicense">
      </div>
      <div class="field">
        <label for="eAddress">Address</label>
        <input type="text" id="eAddress">
      </div>
      <div class="field">
        <label for="eAge">Age</label>
        <input type="text" id="eAge">
      </div>
      <div class="field">
        <label>Photo</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <label class="photo-btn">
            Take photo
            <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoSelect(event)">
          </label>
          <label class="photo-btn">
            Upload photo
            <input type="file" accept="image/*" style="display:none;" onchange="handlePhotoSelect(event)">
          </label>
        </div>
        <img id="photoPreview" style="display:none;width:100px;height:100px;object-fit:cover;border-radius:8px;margin-top:10px;border:1px solid var(--line);">
      </div>
      <button class="primary" type="button" onclick="saveChanges()">Save changes</button>
      <p class="msg" id="saveMsg"></p>
    </div>

    <div class="success" id="successStep" style="display:none;">
      <div class="check">&#10003;</div>
      <h2>Info updated</h2>
      <p id="successName"></p>
    </div>
  </div>
</div>

<script>
const CHECKIN_API_URL = "https://script.google.com/macros/s/AKfycbyh2E21uM3TooJlwllIOL4BfoHkcAnlNautV4zcpZpj2lEUnq66oDDN6TfUiaTbXgMsrQ/exec";

let verifiedName = '';
let verifiedPhone = '';
let pendingPhotoBase64 = null;

async function fetchNameList(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=names`);
    if(!res.ok) throw new Error('Request failed');
    const names = await res.json();
    if(Array.isArray(names)){
      document.getElementById('namesList').innerHTML =
        names.map(n => `<option value="${String(n).replace(/"/g,'&quot;')}">`).join('');
    }
  } catch(err){
    // fall back silently — the person can still type their name manually
  }
}
fetchNameList();

async function verifyIdentity(){
  const msgEl = document.getElementById('verifyMsg');
  const name = document.getElementById('vName').value.trim();
  const phone = document.getElementById('vPhone').value.trim();
  if(!name || !phone){
    msgEl.textContent = 'Enter your name and phone number.';
    msgEl.className = 'msg err';
    return;
  }
  msgEl.textContent = 'Checking…';
  msgEl.className = 'msg';
  try{
    const url = `${CHECKIN_API_URL}?type=verifyPerson&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data && data.verified){
      verifiedName = name;
      verifiedPhone = phone;
      document.getElementById('eName').value = name;
      document.getElementById('ePhone').value = data.phone || phone;
      document.getElementById('eLicense').value = data.license || '';
      document.getElementById('eAddress').value = data.address || '';
      document.getElementById('eAge').value = data.age || '';
      if(data.photoUrl){
        const preview = document.getElementById('photoPreview');
        preview.src = data.photoUrl;
        preview.style.display = 'block';
      }
      document.getElementById('verifyStep').style.display = 'none';
      document.getElementById('editStep').style.display = 'block';
    } else {
      msgEl.textContent = "That name and phone number don't match what's on file.";
      msgEl.className = 'msg err';
    }
  } catch(err){
    msgEl.textContent = 'Could not check right now — try again in a moment.';
    msgEl.className = 'msg err';
  }
}

function resizeImageToDataUrl(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoSelect(event){
  const file = event.target.files[0];
  if(!file) return;
  const dataUrl = await resizeImageToDataUrl(file, 400, 0.7);
  pendingPhotoBase64 = dataUrl;
  const preview = document.getElementById('photoPreview');
  preview.src = dataUrl;
  preview.style.display = 'block';
}

function saveChanges(){
  const msgEl = document.getElementById('saveMsg');
  const payload = {
    recordType: 'contact',
    name: verifiedName,
    verifyPhone: verifiedPhone,
    phone: document.getElementById('ePhone').value.trim(),
    license: document.getElementById('eLicense').value.trim(),
    address: document.getElementById('eAddress').value.trim(),
    age: document.getElementById('eAge').value.trim()
  };
  if(pendingPhotoBase64){
    payload.photoBase64 = pendingPhotoBase64;
  }

  msgEl.textContent = pendingPhotoBase64 ? 'Saving (uploading photo)…' : 'Saving…';
  msgEl.className = 'msg';

  fetch(CHECKIN_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('editStep').style.display = 'none';
    document.getElementById('successStep').style.display = 'block';
    document.getElementById('successName').textContent = `Thanks, ${verifiedName} — your info has been updated.`;
  }).catch(() => {
    msgEl.textContent = 'Could not save — check your connection and try again.';
    msgEl.className = 'msg err';
  });
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
