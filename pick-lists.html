<script>
function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('pyroTheme', 'dark'); } catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    try{ localStorage.setItem('pyroTheme', 'light'); } catch(e){}
  }
  updateThemeToggleIcon();
}
function updateThemeToggleIcon(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const el = document.getElementById('themeToggleIcon');
  if(el) el.textContent = isLight ? '🌙' : '☀️';
}
updateThemeToggleIcon();

  (function(){
    try{
      var saved = localStorage.getItem('pyroTheme');
      var wantLight;
      if(saved === 'light' || saved === 'dark'){
        wantLight = (saved === 'light');
      } else {
        wantLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      }
      if(wantLight){
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch(e){}
  })();
</script>

<body>
<button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Switch theme"><span id="themeToggleIcon">☀️</span></button>

<a class="back-link" href="hp-tools.html">&larr; Back to Head Pyro Tools</a>

<header>
  <div class="logo-ring"><div class="logo-ring-inner"><img src="logo.jpg" alt="Vortex Fireworks Artists logo"></div></div>
  <p class="kicker">Vortex Productions Inc.</p>
  <h1>Pick Lists</h1>
</header>

<div class="divider"></div>

<div class="sheet" id="mainContent">
  <div class="section">
    <div class="field">
      <label for="showSelect">Show</label>
      <select id="showSelect" onchange="onShowChange()"><option value="">Loading pick lists…</option></select>
    </div>

    <p class="hint" id="noShowMsg" style="margin:0;">Choose a show to see its pick list.</p>

    <div id="listArea" style="display:none;">
      <p class="show-title" id="showTitle"></p>
      <p class="show-date" id="showDate"></p>

      <div id="mapBlock" style="display:none;margin-top:16px;">
        <a id="mapLink" href="#" target="_blank" rel="noopener"><img id="mapImg" class="map-img" alt="Site map"></a>
        <p class="hint">Site map — tap it to open it full size.</p>
      </div>

      <div id="listBody"></div>

      <p class="progress" id="progress"></p>

      <div class="actions">
        <button type="button" class="primary" id="pdfBtn" onclick="downloadPDF()">Download as PDF</button>
        <button type="button" class="secondary" id="emailBtn" onclick="emailPDF()">Email PDF</button>
        <button type="button" class="secondary" onclick="clearChecks()">Clear checks</button>
      </div>
      <p class="hint" id="actionStatus" style="min-height:16px;"></p>
    </div>
  </div>
</div>

<script>
const CHECKIN_API_URL = "https://script.google.com/macros/s/AKfycbyh2E21uM3TooJlwllIOL4BfoHkcAnlNautV4zcpZpj2lEUnq66oDDN6TfUiaTbXgMsrQ/exec";
const $ = (id) => document.getElementById(id);
const keyOf = (name) => String(name || '').trim().toLowerCase();
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function setStatus(msg, kind){
  const el = $('actionStatus');
  el.textContent = msg;
  el.style.color = kind === 'ok' ? 'var(--ok)' : kind === 'err' ? 'var(--brick)' : 'var(--ink-soft)';
}

let LISTS = [];
let RACKS_CONFIG = {};
let current = null;
const mapCache = {};                   // site map as a data URL, kept ready so the PDF can be made instantly
const CHECK_PREFIX = 'cuesheet.pickChecks.';

/* ---------- loading ---------- */
async function init(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=pickLists`);
    if(!res.ok) throw new Error('Request failed');
    const j = await res.json();
    RACKS_CONFIG = PickList.normalizeRacksConfig(j.racksConfig);
    LISTS = (j.lists || []).map(l => ({
      name: l.name, eventDate: l.eventDate ? String(l.eventDate).slice(0, 10) : '',
      siteMapUrl: l.siteMapUrl || '', data: l.data || {}
    }));
    buildOptions();
  } catch(err){
    $('showSelect').innerHTML = '<option value="">Could not load pick lists</option>';
    $('noShowMsg').textContent = 'Could not load pick lists — check your connection and reload this page.';
  }
}

function buildOptions(){
  const cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate() - 14);
  const shows = LISTS
    .filter(l => !l.eventDate || new Date(l.eventDate + 'T00:00:00') >= cutoff)
    .sort((a, b) => (a.eventDate || '9999').localeCompare(b.eventDate || '9999') || a.name.localeCompare(b.name));
  const sel = $('showSelect');
  sel.innerHTML = '<option value="">' + (shows.length ? 'Select a show…' : 'No pick lists yet') + '</option>' +
    shows.map(l => `<option value="${esc(l.name)}">${l.eventDate ? esc(PickList.formatDateShort(l.eventDate)) + ' — ' : ''}${esc(l.name)}</option>`).join('');
  if(!shows.length) $('noShowMsg').textContent = "No pick lists have been built yet. They are created under Manage/Edit \u2192 Manage Pick Lists.";
}

function onShowChange(){
  const name = $('showSelect').value;
  current = name ? (LISTS.find(l => l.name === name) || null) : null;
  setStatus('');
  render();
  if(current && current.siteMapUrl) getMapDataUrl(current.name);   // start fetching it for the PDF now
}

/* ---------- what's on the list ---------- */
function buildSections(){
  const data = PickList.normalizeData(current.data);
  const racks = PickList.computeRacks(data, RACKS_CONFIG);
  const sections = [];
  if(data.shells.length){
    sections.push({ title: 'Shells', rows: data.shells.map(s => ({
      id: s.id, main: PickList.sizeLabel(s.size), qty: `${s.qty} ${PickList.unitText(s.unit, s.qty)}` })) });
  }
  if(data.cakes){
    sections.push({ title: 'Cakes', rows: [{ id: 'cakes', main: 'Cakes', qty: String(data.cakes) }] });
  }
  // Finale, Quint, and Special are shown below as part of the Racks list — showing
  // them again in their own section here would just duplicate the same line twice.
  if(racks.items.length || racks.state === 'partial'){
    const rows = racks.items.map(it => ({ id: 'racks-' + it.key, main: it.label, qty: String(it.qty) }));
    if(racks.state === 'partial') rows.push({ id: 'racks-note', main: 'Racks', note: `not counting ${racks.unknownSizes.join(', ')} boxes yet` });
    sections.push({ title: 'Racks', rows: rows });
  }
  sections.push({ title: 'Permanent items', rows: PickList.PERMANENT_ITEMS.map(name => {
    const k = PickList.permanentItemKey(name);
    const qty = data.permanent[k];
    return { id: 'perm-' + k, main: name, qty: qty == null ? '' : String(qty) };
  }) });
  if(data.setup.length){
    sections.push({ title: 'Setup items', rows: data.setup.map(s => ({
      id: s.id, main: s.title, qty: s.qty == null ? '' : String(s.qty) })) });
  }
  return sections;
}

function loadChecks(){
  try{ return JSON.parse(localStorage.getItem(CHECK_PREFIX + keyOf(current.name)) || '{}') || {}; }
  catch(e){ return {}; }
}
function saveChecks(obj){
  try{ localStorage.setItem(CHECK_PREFIX + keyOf(current.name), JSON.stringify(obj)); } catch(e){}
}

function render(){
  const area = $('listArea');
  if(!current){ area.style.display = 'none'; $('noShowMsg').style.display = 'block'; return; }
  $('noShowMsg').style.display = 'none';
  area.style.display = 'block';
  $('showTitle').textContent = current.name;
  $('showDate').textContent = PickList.formatDateLong(current.eventDate);

  if(current.siteMapUrl){
    $('mapImg').src = current.siteMapUrl;
    $('mapLink').href = current.siteMapUrl;
    $('mapBlock').style.display = 'block';
  } else {
    $('mapImg').removeAttribute('src');
    $('mapBlock').style.display = 'none';
  }

  const checks = loadChecks();
  let html = '';
  buildSections().forEach(sec => {
    html += `<p class="pl-h">${esc(sec.title)}</p>`;
    sec.rows.forEach(r => {
      if(r.note){
        html += `<div class="check-row static"><span class="txt">${esc(r.main)}</span><span class="qty">${esc(r.note)}</span></div>`;
      } else {
        const on = !!checks[r.id];
        html += `<label class="check-row${on ? ' done' : ''}"><input type="checkbox" data-id="${esc(r.id)}"${on ? ' checked' : ''}><span class="txt">${esc(r.main)}</span><span class="qty">${esc(r.qty)}</span></label>`;
      }
    });
  });
  if(!html) html = '<p class="hint" style="margin-top:18px;">Nothing has been added to this pick list yet.</p>';
  $('listBody').innerHTML = html;
  updateProgress();
}

function updateProgress(){
  const boxes = Array.from(document.querySelectorAll('#listBody input[type=checkbox]'));
  const done = boxes.filter(b => b.checked).length;
  $('progress').textContent = boxes.length ? `${done} of ${boxes.length} checked off` + (done === boxes.length ? ' — all packed \u2713' : '') : '';
}

$('listBody').addEventListener('change', (e) => {
  const cb = e.target;
  if(!cb.matches || !cb.matches('input[type=checkbox]') || !current) return;
  const checks = loadChecks();
  if(cb.checked) checks[cb.dataset.id] = true; else delete checks[cb.dataset.id];
  saveChecks(checks);
  cb.closest('.check-row').classList.toggle('done', cb.checked);
  updateProgress();
});

function clearChecks(){
  if(!current) return;
  if(!confirm('Clear every check mark on this pick list?')) return;
  saveChecks({});
  render();
}

/* ---------- PDF + email ---------- */
async function getMapDataUrl(name){
  const k = keyOf(name);
  if(mapCache[k] !== undefined) return mapCache[k];
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=pickListSiteMapData&name=${encodeURIComponent(name)}`);
    const j = await res.json();
    mapCache[k] = (j && j.dataUrl) ? j.dataUrl : '';
    return mapCache[k];
  } catch(err){
    return '';                        // not cached, so the next try can succeed
  }
}
function loadImageSize(dataUrl){
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve({ w: im.naturalWidth, h: im.naturalHeight });
    im.onerror = () => resolve(null);
    im.src = dataUrl;
  });
}

async function buildPDF(){
  if(!window.jspdf) throw new Error('The PDF tool did not load — check your connection and try again.');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 48, FOOT = 36;
  const dateLong = PickList.formatDateLong(current.eventDate);
  let y = M;
  const ensure = (need) => { if(y + need > H - M - FOOT){ doc.addPage(); y = M; } };

  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(217, 90, 20);
  doc.text('PICK LIST', M, y + 9); y += 22;
  doc.setFontSize(22); doc.setTextColor(20);
  const titleLines = doc.splitTextToSize(current.name, W - 2 * M);
  doc.text(titleLines, M, y + 18); y += titleLines.length * 26;
  if(dateLong){
    doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.setTextColor(90);
    doc.text(dateLong, M, y + 10); y += 24;
  }
  doc.setDrawColor(255, 140, 0); doc.setLineWidth(2); doc.line(M, y, W - M, y); y += 6;

  buildSections().forEach(sec => {
    ensure(60);
    y += 14;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(90);
    doc.text(sec.title.toUpperCase(), M, y + 10); y += 16;
    doc.setDrawColor(200); doc.setLineWidth(0.5); doc.line(M, y, W - M, y); y += 2;
    sec.rows.forEach(r => {
      doc.setFontSize(12);
      if(r.note){
        ensure(24);
        doc.setFont('helvetica', 'italic'); doc.setTextColor(120);
        doc.text(`${r.main} \u2014 ${r.note}`, M + 22, y + 15);
        y += 24; return;
      }
      doc.setFont('helvetica', 'normal');
      const qtyW = r.qty ? doc.getTextWidth(r.qty) : 0;
      doc.setFont('helvetica', 'bold');
      const lines = doc.splitTextToSize(r.main, W - 2 * M - 22 - (qtyW ? qtyW + 16 : 0));
      const h = Math.max(24, lines.length * 15 + 9);
      ensure(h);
      doc.setDrawColor(60); doc.setLineWidth(1); doc.rect(M, y + 6, 11, 11);
      doc.setTextColor(20); doc.text(lines, M + 22, y + 15);
      if(r.qty){
        doc.setFont('helvetica', 'normal'); doc.setTextColor(70);
        doc.text(r.qty, W - M, y + 15, { align: 'right' });
      }
      y += h;
    });
  });

  let mapSkipped = false;
  if(current.siteMapUrl){
    const dataUrl = await getMapDataUrl(current.name);
    const size = dataUrl ? await loadImageSize(dataUrl) : null;
    if(size){
      doc.addPage(); y = M;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(90);
      doc.text('SITE MAP', M, y + 10); y += 22;
      const maxW = W - 2 * M, maxH = H - y - M - FOOT;
      const scale = Math.min(maxW / size.w, maxH / size.h);
      const w = size.w * scale, h = size.h * scale;
      doc.addImage(dataUrl, /^data:image\/png/.test(dataUrl) ? 'PNG' : 'JPEG', M + (maxW - w) / 2, y, w, h);
    } else {
      mapSkipped = true;
    }
  }

  const pages = doc.getNumberOfPages();
  for(let i = 1; i <= pages; i++){
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(`${current.name} \u2014 Pick list`, M, H - 28);
    doc.text(`Page ${i} of ${pages}`, W - M, H - 28, { align: 'right' });
  }
  return { doc, mapSkipped };
}

function buildText(){
  const dateLong = PickList.formatDateLong(current.eventDate);
  let t = `Pick List \u2014 ${current.name}${dateLong ? ' \u2014 ' + dateLong : ''}\n`;
  buildSections().forEach(sec => {
    t += `\n${sec.title.toUpperCase()}\n`;
    sec.rows.forEach(r => {
      t += r.note ? `   ${r.main} \u2014 ${r.note}\n` : `[ ] ${r.main}${r.qty ? ' \u2014 ' + r.qty : ''}\n`;
    });
  });
  return t.trim();
}

function fileNameFor(){
  const safe = current.name.replace(/[^\w\- ]+/g, '').trim() || 'Show';
  return `PickList - ${safe} - ${current.eventDate || 'undated'}.pdf`;
}

async function withBusy(fn){
  const buttons = [$('pdfBtn'), $('emailBtn')];
  buttons.forEach(b => b.disabled = true);
  try{ await fn(); }
  catch(err){ setStatus(err && err.message ? err.message : 'Something went wrong — please try again.', 'err'); }
  finally{ buttons.forEach(b => b.disabled = false); }
}

function downloadPDF(){
  if(!current) return;
  return withBusy(async () => {
    setStatus('Making the PDF…');
    const { doc, mapSkipped } = await buildPDF();
    doc.save(fileNameFor());
    setStatus(mapSkipped ? 'PDF saved — but the site map could not be added to it. Check your connection and try again.' : 'PDF saved \u2713', mapSkipped ? 'err' : 'ok');
  });
}

function emailPDF(){
  if(!current) return;
  return withBusy(async () => {
    setStatus('Making the PDF…');
    const { doc, mapSkipped } = await buildPDF();
    const fileName = fileNameFor();
    const dateShort = current.eventDate || '';
    const subject = `Pick List - ${current.name}${dateShort ? ' - ' + dateShort : ''}`;
    const note = mapSkipped ? ' (The site map could not be added to the PDF.)' : '';

    // Best case: the phone's share sheet attaches the real PDF to Mail (or any app).
    if(navigator.canShare){
      try{
        const file = new File([doc.output('blob')], fileName, { type: 'application/pdf' });
        if(navigator.canShare({ files: [file] })){
          setStatus('Opening the share sheet…' + note);
          await navigator.share({ files: [file], title: subject, text: subject });
          setStatus('');
          return;
        }
      } catch(err){
        if(err && err.name === 'AbortError'){ setStatus(''); return; }   // they closed the share sheet
        // any other problem: fall through to the email fallback below
      }
    }

    // Fallback: download the PDF and open an email with the list typed out in it.
    doc.save(fileName);
    let body = buildText();
    if(body.length > 1500) body = body.slice(0, 1500).replace(/\n[^\n]*$/, '') + '\n...';
    body += '\n\n(The PDF was downloaded separately — please attach it to this email before sending.)';
    setStatus('PDF downloaded — attach it in the email that opens.' + note, 'ok');
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  });
}

init();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
