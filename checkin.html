<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Check-In — Vortex Productions</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" href="icon-192.png">
<script>
function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('pyroTheme', 'dark'); } catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    try{ localStorage.setItem('pyroTheme', 'light'); } catch(e){}
  }
  updateThemeToggleIcon();
}
function updateThemeToggleIcon(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const el = document.getElementById('themeToggleIcon');
  if(el) el.textContent = isLight ? '🌙' : '☀️';
}
updateThemeToggleIcon();

  (function(){
    try{
      var saved = localStorage.getItem('pyroTheme');
      var wantLight;
      if(saved === 'light' || saved === 'dark'){
        wantLight = (saved === 'light');
      } else {
        wantLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      }
      if(wantLight){
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch(e){}
  })();
</script>
<style>
  :root{
    --kicker:#ffb98a; --surface-6:rgba(10,14,26,0.6); --surface-5:rgba(10,14,26,0.5); --bg1:#16233f; --bg2:#0a0f1e; --bg3:#05070f;
    --accent1:#d92b2b; --accent2:#ff8c00; --accent3:#ffd23f; --accent4:#2f7ec9; --accent5:#123a63;
    --ink:#f4f1ea; --ink-soft:#a3a9bf; --line:rgba(255,255,255,0.1);
    --card:rgba(22,28,48,0.75); --ok:#4caf7d; --err:#ff6a5a;
  }

  :root[data-theme="light"]{
    --kicker:#c9601f; --surface-6:rgba(255,255,255,0.7); --surface-5:rgba(255,255,255,0.6); --bg1:#fdf3e7; --bg2:#f7ead9; --bg3:#f0e0c9; --ink:#241f18; --ink-soft:#6b6152; --card:rgba(255,255,255,0.78); --line:rgba(36,31,24,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:32px 16px;
  }
  .card{
    max-width:440px; width:100%;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
    backdrop-filter:blur(6px);
  }
  header{
    background:var(--surface-5); color:var(--ink);
    padding:22px 24px; border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg,var(--accent1),var(--accent2) 35%,var(--accent3) 55%,var(--accent4) 80%,var(--accent5)) 1;
    display:flex; align-items:center; gap:14px;
  }
  header img{width:44px;height:44px;flex-shrink:0;border-radius:8px;background:#fff;}
  header .kicker{font-size:11px;letter-spacing:.08em;color:var(--kicker);margin:0 0 4px;font-weight:700;text-transform:uppercase;}
  header h1{margin:0;font-size:19px;font-weight:700;line-height:1.3;}
  .body{padding:24px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
  label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  input[type=text],input[type=number],input[type=date],input[type=time],select{
    font-size:15px;padding:10px 12px;border:1px solid var(--line);
    border-radius:6px;background:var(--surface-6);color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:#ff8c00;box-shadow:0 0 0 2px rgba(255,140,0,0.2);}
  input[readonly]{background:rgba(255,255,255,0.04);color:var(--ink-soft);}
  button.primary{
    width:100%; color:#fdf6f2; border:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    font-size:14px; font-weight:700; padding:12px 20px; border-radius:8px; cursor:pointer;
    box-shadow:0 0 18px rgba(255,140,0,0.3);
  }
  button.primary:disabled{opacity:.6;cursor:default;box-shadow:none;}
  button.primary:hover:not(:disabled){filter:brightness(1.1);}
  .msg{font-size:13px;margin-top:14px;text-align:center;}
  .msg.ok{color:var(--ok);}
  .msg.err{color:var(--err);}
  .field-err{font-size:11.5px;color:var(--err);margin:4px 0 0;}
  input.invalid{border-color:var(--err) !important;}
  .success{
    padding:40px 24px;text-align:center;
  }
  .success .check{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--ok),#2f7ec9);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:28px;margin:0 auto 16px;
    box-shadow:0 0 20px rgba(76,175,125,0.4);
    animation:checkPop 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes checkPop{
    0%{transform:scale(0); opacity:0;}
    60%{transform:scale(1.15); opacity:1;}
    100%{transform:scale(1);}
  }
  .success h2{margin:0 0 6px;font-size:18px;color:var(--ink);}
  .success p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .back-link{
    display:block; max-width:440px; margin:0 auto 12px; padding:0 4px;
    font-size:12.5px; color:var(--ink-soft); text-decoration:none;
  }
  .back-link:hover{color:#ffb98a;}
  .theme-toggle{
    position:fixed; top:14px; right:14px; z-index:50;
    width:36px;height:36px;border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:16px; cursor:pointer;
    transition:transform 0.15s ease;
  }
  .theme-toggle:hover{transform:scale(1.08);}
</style>

</head>
<body>
<button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Switch theme"><span id="themeToggleIcon">☀️</span></button>


<div style="max-width:440px;width:100%;">
<div id="queueBanner" style="display:none;margin:0 0 12px;background:rgba(255,140,0,0.12);border:1px solid rgba(255,140,0,0.35);border-radius:10px;padding:10px 14px;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:#f4f1ea;">
  <span id="queueBannerMsg">Waiting to send…</span>
  <button type="button" onclick="flushQueue()" style="background:none;border:1px solid rgba(255,255,255,0.2);color:#f4f1ea;font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;">Retry now</button>
</div>
<a class="back-link" href="index.html">&larr; Back to main menu</a>
<div class="card">
  <header>
    <img src="logo.jpg" alt="Vortex Fireworks Artists logo">
    <div>
      <p class="kicker">VORTEX PRODUCTIONS INC.</p>
      <h1 id="eventTitle">Event Check-In</h1>
    </div>
  </header>
  <div class="body" id="formBody">
    <div class="field">
      <label for="eventName">Event / venue</label>
      <select id="eventName">
        <option value="" disabled selected>Select a venue…</option>
      </select>
    </div>
    <div class="field">
      <label for="eventDate">Date of Check-In</label>
      <input type="date" id="eventDate">
    </div>
    <div class="field">
      <label for="checkInTime">Time</label>
      <input type="time" id="checkInTime">
    </div>
    <div class="field">
      <label for="personPhone">Phone number</label>
      <input type="tel" id="personPhone" oninput="checkPhoneMatch()">
      <p style="font-size:11px;color:var(--ink-soft);margin:4px 0 0;">Enter the phone number on file to auto-fill your license and address.</p>
      <p id="phoneCheckStatus" style="font-size:11px;color:var(--ink-soft);margin:4px 0 0;min-height:14px;"></p>
    </div>
    <div class="field">
      <label for="personName">Your name</label>
      <input type="text" id="personName" list="contactsList" oninput="autofill(this)" onblur="this.value = toTitleCase(this.value)" autocomplete="off">
      <datalist id="contactsList"></datalist>
    </div>
    <div class="field">
      <label for="personDisplayLicense">Display Operator (D)</label>
      <input type="text" id="personDisplayLicense" oninput="validateLicenseField(this)" onblur="validateLicenseField(this)">
      <p class="field-err" id="personDisplayLicenseErr" style="display:none;"></p>
    </div>
    <div class="field">
      <label for="personSFXLicense">Special Effects Operator (P)</label>
      <input type="text" id="personSFXLicense" oninput="validateLicenseField(this)" onblur="validateLicenseField(this)">
      <p class="field-err" id="personSFXLicenseErr" style="display:none;"></p>
    </div>
    <div class="field">
      <label for="personFlameLicense">Flame Effects Operator (F)</label>
      <input type="text" id="personFlameLicense" oninput="validateLicenseField(this)" onblur="validateLicenseField(this)">
      <p class="field-err" id="personFlameLicenseErr" style="display:none;"></p>
    </div>
    <div class="field">
      <label for="personAddress">Address</label>
      <input type="text" id="personAddress" onblur="this.value = toTitleCase(this.value)">
    </div>
    <div class="field">
      <label for="personAge">Age</label>
      <input type="text" id="personAge">
    </div>
    <div class="field" style="flex-direction:row;align-items:center;gap:8px;">
      <input type="checkbox" id="isHeadPyro" style="width:auto;" disabled>
      <label for="isHeadPyro" id="isHeadPyroLabel" style="font-weight:400;color:var(--ink-soft);">Head Pyro for this event (verify your phone number first)</label>
    </div>
    <button class="primary" id="submitBtn" onclick="checkIn()">Check in</button>
    <p class="msg" id="msg"></p>
  </div>
</div>
</div>

<script>
const CHECKIN_API_URL = "https://script.google.com/macros/s/AKfycbyh2E21uM3TooJlwllIOL4BfoHkcAnlNautV4zcpZpj2lEUnq66oDDN6TfUiaTbXgMsrQ/exec";

// Only names are ever kept in the browser — license/address/age/phone are
// looked up on the server, and only released after a matching phone number
// is entered for that exact name. See checkPhoneMatch().
async function fetchNameList(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=names`);
    if(!res.ok) throw new Error('Request failed');
    const names = await res.json();
    if(Array.isArray(names)){
      document.getElementById('contactsList').innerHTML =
        names.map(n => `<option value="${String(n).replace(/"/g,'&quot;')}">`).join('');
    }
  } catch(err){
    // fall back silently — manual entry still works even if this fails
  }
}
fetchNameList();

const VENUE_DIRECTORY = {};
[
  "Real Salt Lake","University of Utah","Salt Lake Bees","Trailer Loading","Shop Time","Bunker Time",
  "Hillcrest High School","Jordan High School","Copper Hills High School","Herriman High School",
  "North Ridge High School","Bee's - Class \"C\" Show","West Jordan High School","American Heritage High School",
  "Sleepy Ridge","Mountain Ridge High School","Stansbury High School","Bingham High School","Bluffdale City",
  "Midvale City","Utah Valley University","Southeast Township Days","Magna - Day 1","Magna - Day 2",
  "Murray City","Ogden Raptors","Farr West","West Point","Moab - 4th of July","Dutch John",
  "Weber State University","Draper City","Bountiful City","American Fork City","Lehi City","Springville City",
  "West Valley City (West Fest)","Clinton City","Thanksgiving Point Waterfall Concert","Dugway City",
  "Taylorsville - Thursday","Taylorsville - Friday","Taylorsville - Saturday","Olympus High School","Moab - Music Festival"
].forEach(name => { VENUE_DIRECTORY[name.toLowerCase()] = { name: name, eventDate: '' }; });

function formatDateForOption(dateStr){
  if(!dateStr) return '';
  const parts = dateStr.split('-');
  if(parts.length !== 3) return dateStr;
  const [y, m, d] = parts;
  return `${Number(m)}/${Number(d)}`;
}

const ALWAYS_AVAILABLE_NO_DATE = ['shop time', 'trailer loading', 'bunker time'];

function populateVenueSelect(){
  const select = document.getElementById('eventName');
  const currentValue = select.value;
  const sorted = Object.values(VENUE_DIRECTORY)
    .filter(v => v.eventDate || ALWAYS_AVAILABLE_NO_DATE.includes(v.name.trim().toLowerCase()))
    .sort((a, b) => {
      if(a.eventDate && b.eventDate) return a.eventDate.localeCompare(b.eventDate);
      if(a.eventDate && !b.eventDate) return -1;
      if(!a.eventDate && b.eventDate) return 1;
      return a.name.localeCompare(b.name);
    });
  select.innerHTML = '<option value="" disabled>Select a venue…</option>' +
    sorted.map(v => {
      const label = v.eventDate ? `${formatDateForOption(v.eventDate)} — ${v.name}` : v.name;
      return `<option value="${v.name.replace(/"/g,'&quot;')}">${label.replace(/</g,'&lt;')}</option>`;
    }).join('');
  if(currentValue){
    select.value = currentValue;
  } else {
    select.selectedIndex = 0;
  }
}
populateVenueSelect();

function applyEventFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const eventFromUrl = params.get('event') || '';
  if(!eventFromUrl) return;
  const eventSelect = document.getElementById('eventName');
  const match = Array.from(eventSelect.options).find(
    opt => opt.value.toLowerCase() === eventFromUrl.toLowerCase()
  );
  if(match){
    eventSelect.value = match.value;
    document.getElementById('eventTitle').textContent = match.value;
  } else {
    document.getElementById('eventTitle').textContent = eventFromUrl;
  }
}
applyEventFromUrl();

async function fetchVenueDirectory(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=venues`);
    if(!res.ok) throw new Error('Request failed');
    const sheetVenues = await res.json();
    if(Array.isArray(sheetVenues)){
      sheetVenues.forEach(v => {
        if(!v.name) return;
        VENUE_DIRECTORY[v.name.trim().toLowerCase()] = { name: v.name.trim(), eventDate: v.eventDate || '' };
      });
      populateVenueSelect();
      applyEventFromUrl();
    }
  } catch(err){
    // fall back silently to the built-in venue list
  }
}
fetchVenueDirectory();

const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD in local time
document.getElementById('eventDate').value = todayStr;

const nowTimeStr = new Date().toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}); // HH:MM 24hr for <input type=time>
document.getElementById('checkInTime').value = nowTimeStr;

function autofill(nameInput){
  // Don't reveal license/address/age just from typing a name.
  // Those only unlock once the correct phone number is entered below.
  document.getElementById('personDisplayLicense').value = '';
  document.getElementById('personSFXLicense').value = '';
  document.getElementById('personFlameLicense').value = '';
  document.getElementById('personAddress').value = '';
  document.getElementById('personAge').value = '';
  checkPhoneMatch();
}

function normalizePhoneDigits(str){
  return (str || '').replace(/\D/g, '');
}

let phoneCheckTimer = null;
let phoneCheckToken = 0;

function setHeadPyroLock(enabled, message){
  const checkbox = document.getElementById('isHeadPyro');
  const label = document.getElementById('isHeadPyroLabel');
  checkbox.disabled = !enabled;
  if(!enabled) checkbox.checked = false;
  label.style.color = enabled ? 'var(--ink)' : 'var(--ink-soft)';
  label.textContent = enabled
    ? 'Head Pyro for this event'
    : `Head Pyro for this event (${message})`;
}

function checkPhoneMatch(){
  clearTimeout(phoneCheckTimer);
  const statusEl = document.getElementById('phoneCheckStatus');
  const enteredPhone = normalizePhoneDigits(document.getElementById('personPhone').value);
  if(enteredPhone.length < 7){
    document.getElementById('personDisplayLicense').value = '';
    document.getElementById('personSFXLicense').value = '';
    document.getElementById('personFlameLicense').value = '';
    document.getElementById('personAddress').value = '';
    document.getElementById('personAge').value = '';
    setHeadPyroLock(false, 'verify your phone number first');
    statusEl.textContent = '';
    return;
  }
  statusEl.textContent = 'Checking…';
  phoneCheckTimer = setTimeout(verifyPhoneWithServer, 450);
}

async function verifyPhoneWithServer(){
  const statusEl = document.getElementById('phoneCheckStatus');
  const name = document.getElementById('personName').value.trim();
  const phone = document.getElementById('personPhone').value.trim();
  if(!name || !phone){
    statusEl.textContent = '';
    return;
  }
  const myToken = ++phoneCheckToken;
  try{
    const url = `${CHECKIN_API_URL}?type=verifyPerson&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`;
    const res = await fetch(url);
    if(!res.ok){
      if(myToken === phoneCheckToken) statusEl.textContent = '';
      return;
    }
    const data = await res.json();
    if(myToken !== phoneCheckToken) return; // a newer keystroke already superseded this check
    if(data && data.verified){
      document.getElementById('personDisplayLicense').value = data.displayLicense || '';
      document.getElementById('personSFXLicense').value = data.specialEffectsLicense || '';
      document.getElementById('personFlameLicense').value = data.flameLicense || '';
      document.getElementById('personAddress').value = data.address || '';
      document.getElementById('personAge').value = data.age || '';
      const hasLicense = !!(data.displayLicense || data.specialEffectsLicense || data.flameLicense);
      setHeadPyroLock(hasLicense, hasLicense ? '' : 'no license on file');
    } else {
      document.getElementById('personDisplayLicense').value = '';
      document.getElementById('personSFXLicense').value = '';
      document.getElementById('personFlameLicense').value = '';
      document.getElementById('personAddress').value = '';
      document.getElementById('personAge').value = '';
      setHeadPyroLock(false, 'verify your phone number first');
    }
    statusEl.textContent = '';
  } catch(err){
    // silent fail — the person can still fill everything in manually
    if(myToken === phoneCheckToken) statusEl.textContent = '';
  }
}

// The "Russ Check" — rejects license numbers that don't start with "FE"
// followed by digits, to stop joke/garbage entries in the license fields.
const LICENSE_FORMAT = /^FE\d+$/i;

function toTitleCase(str){
  if(!str) return str;
  return str.trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function validateLicenseField(input){
  const errEl = document.getElementById(input.id + 'Err');
  const value = input.value.trim();
  if(!value){
    input.classList.remove('invalid');
    errEl.style.display = 'none';
    return true;
  }
  if(LICENSE_FORMAT.test(value)){
    input.classList.remove('invalid');
    errEl.style.display = 'none';
    return true;
  }
  input.classList.add('invalid');
  errEl.textContent = 'Doesn\'t pass the Russ Check parameters — license numbers start with "FE" followed by numbers (example: FE123456).';
  errEl.style.display = 'block';
  return false;
}

function allLicenseFieldsValid(){
  const ids = ['personDisplayLicense', 'personSFXLicense', 'personFlameLicense'];
  let allValid = true;
  ids.forEach(id => {
    const valid = validateLicenseField(document.getElementById(id));
    if(!valid) allValid = false;
  });
  return allValid;
}

function checkIn(){
  const eventName = document.getElementById('eventName').value.trim();
  const name = document.getElementById('personName').value.trim();
  const msg = document.getElementById('msg');

  if(!eventName || !name){
    msg.textContent = 'Enter the event and your name before checking in.';
    msg.className = 'msg err';
    return;
  }

  if(!allLicenseFieldsValid()){
    msg.textContent = 'One or more license numbers don\'t pass the Russ Check parameters — please fix the format before checking in.';
    msg.className = 'msg err';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Checking in…';

  const displayLicense = document.getElementById('personDisplayLicense').value.trim();
  const sfxLicense = document.getElementById('personSFXLicense').value.trim();
  const flameLicense = document.getElementById('personFlameLicense').value.trim();
  const licenseParts = [];
  if(displayLicense) licenseParts.push('D: ' + displayLicense);
  if(sfxLicense) licenseParts.push('P: ' + sfxLicense);
  if(flameLicense) licenseParts.push('F: ' + flameLicense);

  const payload = {
    event: eventName,
    eventDate: document.getElementById('eventDate').value,
    checkInTime: document.getElementById('checkInTime').value,
    name: name,
    license: licenseParts.join(' · '),
    phone: document.getElementById('personPhone').value.trim(),
    address: document.getElementById('personAddress').value.trim(),
    age: document.getElementById('personAge').value.trim(),
    isHeadPyro: document.getElementById('isHeadPyro').checked
  };

  submitCheckIn(payload, name, eventName);
}

function submitCheckIn(payload, name, eventName){
  const btn = document.getElementById('submitBtn');
  fetch(CHECKIN_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('formBody').innerHTML = `
      <div class="success">
        <div class="check">&#10003;</div>
        <h2>You're checked in</h2>
        <p>${name} — ${eventName}</p>
      </div>`;
  }).catch(() => {
    queueCheckIn(payload);
    document.getElementById('formBody').innerHTML = `
      <div class="success">
        <div class="check">&#10003;</div>
        <h2>Saved — will send automatically</h2>
        <p>${name} — ${eventName}<br>No connection right now, but this is saved on your device and will send the moment you're back online.</p>
      </div>`;
  });
}

const CHECKIN_QUEUE_KEY = 'checkinQueue_v1';

function getQueue(){
  try{ return JSON.parse(localStorage.getItem(CHECKIN_QUEUE_KEY) || '[]'); } catch(e){ return []; }
}

function setQueue(q){
  try{ localStorage.setItem(CHECKIN_QUEUE_KEY, JSON.stringify(q)); } catch(e){}
}

function queueCheckIn(payload){
  const q = getQueue();
  q.push(payload);
  setQueue(q);
  updateQueueBanner();
}

async function flushQueue(){
  const q = getQueue();
  if(q.length === 0) return;
  const remaining = [];
  for(let i = 0; i < q.length; i++){
    try{
      await fetch(CHECKIN_API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(q[i]) });
    } catch(err){
      // still offline — keep this one and everything after it queued, stop trying for now
      remaining.push(...q.slice(i));
      break;
    }
  }
  setQueue(remaining);
  updateQueueBanner();
}

function updateQueueBanner(){
  const q = getQueue();
  const banner = document.getElementById('queueBanner');
  if(q.length > 0){
    banner.style.display = 'flex';
    document.getElementById('queueBannerMsg').textContent = `${q.length} check-in${q.length > 1 ? 's' : ''} waiting to send`;
  } else {
    banner.style.display = 'none';
  }
}

window.addEventListener('online', flushQueue);
window.addEventListener('load', flushQueue);
updateQueueBanner();
</script>
</body>
</html>
