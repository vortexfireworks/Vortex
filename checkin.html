<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Check-In — Vortex Productions</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c2b3a">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --navy:#1c2b3a; --brick:#8c3b2e; --brick-light:#b5493a;
    --paper:#f6f3ec; --card:#ffffff; --line:#d8d2c4;
    --ink:#20262c; --ink-soft:#5b6470; --ok:#2f6d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--paper); color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:32px 16px;
  }
  .card{
    max-width:440px; width:100%;
    background:var(--card); border:1px solid var(--line);
    border-radius:6px; overflow:hidden;
  }
  header{
    background:var(--navy); color:#f2efe6;
    padding:22px 24px; border-bottom:4px solid var(--brick);
    display:flex; align-items:center; gap:14px;
  }
  header img{width:44px;height:44px;flex-shrink:0;border-radius:4px;background:#fff;}
  header .kicker{font-size:11px;letter-spacing:.08em;color:#c9d2da;margin:0 0 4px;}
  header h1{margin:0;font-size:19px;font-weight:600;line-height:1.3;}
  .body{padding:24px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
  label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  input[type=text],input[type=number],select{
    font-size:15px;padding:10px 12px;border:1px solid var(--line);
    border-radius:3px;background:#fdfcfa;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(28,43,58,0.12);}
  input[readonly]{background:#eee9dd;color:var(--ink-soft);}
  button.primary{
    width:100%; background:var(--brick); color:#fdf6f2; border:none;
    font-size:15px; font-weight:600; padding:13px 16px; border-radius:3px; cursor:pointer;
  }
  button.primary:disabled{opacity:.6;cursor:default;}
  button.primary:hover:not(:disabled){background:var(--brick-light);}
  .msg{font-size:13px;margin-top:14px;text-align:center;}
  .msg.ok{color:var(--ok);}
  .msg.err{color:var(--brick);}
  .success{
    padding:40px 24px;text-align:center;
  }
  .success .check{
    width:56px;height:56px;border-radius:50%;background:var(--ok);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:28px;margin:0 auto 16px;
  }
  .success h2{margin:0 0 6px;font-size:18px;color:var(--ink);}
  .success p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .back-link{
    display:block; max-width:440px; margin:0 auto 12px; padding:0 4px;
    font-size:12.5px; color:var(--ink-soft); text-decoration:none;
  }
  .back-link:hover{color:var(--navy);}
</style>
</head>
<body>

<div style="max-width:440px;width:100%;">
<a class="back-link" href="index.html">&larr; Back to main menu</a>
<div class="card">
  <header>
    <img src="logo.jpg" alt="Vortex Fireworks Artists logo">
    <div>
      <p class="kicker">VORTEX PRODUCTIONS INC.</p>
      <h1 id="eventTitle">Event Check-In</h1>
    </div>
  </header>
  <div class="body" id="formBody">
    <div class="field">
      <label for="eventName">Event / venue</label>
      <select id="eventName">
        <option value="" disabled selected>Select a venue…</option>
      </select>
    </div>
    <div class="field">
      <label for="eventDate">Date of event</label>
      <input type="date" id="eventDate">
    </div>
    <div class="field">
      <label for="checkInTime">Time</label>
      <input type="time" id="checkInTime">
    </div>
    <div class="field">
      <label for="personName">Your name</label>
      <input type="text" id="personName" list="contactsList" oninput="autofill(this)" autocomplete="off">
      <datalist id="contactsList"></datalist>
    </div>
    <div class="field">
      <label for="personLicense">License number</label>
      <input type="text" id="personLicense">
    </div>
    <div class="field">
      <label for="personPhone">Phone number</label>
      <input type="text" id="personPhone">
    </div>
    <div class="field">
      <label for="personAddress">Address</label>
      <input type="text" id="personAddress">
    </div>
    <div class="field">
      <label for="personAge">Age</label>
      <input type="text" id="personAge">
    </div>
    <button class="primary" id="submitBtn" onclick="checkIn()">Check in</button>
    <p class="msg" id="msg"></p>
  </div>
</div>
</div>

<script>
const CONTACTS = [
];
const CONTACTS_BY_NAME = {};
CONTACTS.forEach(c => CONTACTS_BY_NAME[c.name.toLowerCase()] = c);

const CHECKIN_API_URL = "https://script.google.com/macros/s/AKfycbyh2E21uM3TooJlwllIOL4BfoHkcAnlNautV4zcpZpj2lEUnq66oDDN6TfUiaTbXgMsrQ/exec";

document.getElementById('contactsList').innerHTML =
  CONTACTS.map(c => `<option value="${c.name}">`).join('');

const VENUE_DIRECTORY = {};
[
  "Real Salt Lake","University of Utah","Salt Lake Bees","Trailer Loading","Shop Time","Bunker Time",
  "Hillcrest High School","Jordan High School","Copper Hills High School","Herriman High School",
  "North Ridge High School","Bee's - Class \"C\" Show","West Jordan High School","American Heritage High School",
  "Sleepy Ridge","Mountain Ridge High School","Stansbury High School","Bingham High School","Bluffdale City",
  "Midvale City","Utah Valley University","Southeast Township Days","Magna - Day 1","Magna - Day 2",
  "Murray City","Ogden Raptors","Farr West","West Point","Moab - 4th of July","Dutch John",
  "Weber State University","Draper City","Bountiful City","American Fork City","Lehi City","Springville City",
  "West Valley City (West Fest)","Clinton City","Thanksgiving Point Waterfall Concert","Dugway City",
  "Taylorsville - Thursday","Taylorsville - Friday","Taylorsville - Saturday","Olympus High School","Moab - Music Festival"
].forEach(name => { VENUE_DIRECTORY[name.toLowerCase()] = name; });

function populateVenueSelect(){
  const select = document.getElementById('eventName');
  const currentValue = select.value;
  const sortedNames = Object.values(VENUE_DIRECTORY).sort((a,b) => a.localeCompare(b));
  select.innerHTML = '<option value="" disabled>Select a venue…</option>' +
    sortedNames.map(name => `<option value="${name.replace(/"/g,'&quot;')}">${name}</option>`).join('');
  if(currentValue){
    select.value = currentValue;
  } else {
    select.selectedIndex = 0;
  }
}
populateVenueSelect();

async function fetchOperatorDirectory(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=contacts`);
    if(!res.ok) throw new Error('Request failed');
    const sheetContacts = await res.json();
    if(Array.isArray(sheetContacts)){
      sheetContacts.forEach(c => {
        if(!c.name) return;
        CONTACTS_BY_NAME[c.name.trim().toLowerCase()] = {
          name: c.name.trim(),
          license: c.license || '',
          phone: c.phone || '',
          address: c.address || '',
          age: c.age || ''
        };
      });
      document.getElementById('contactsList').innerHTML =
        Object.values(CONTACTS_BY_NAME).map(c => `<option value="${c.name}">`).join('');
    }
  } catch(err){
    // fall back silently to the built-in contact list
  }
}
fetchOperatorDirectory();

function applyEventFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const eventFromUrl = params.get('event') || '';
  if(!eventFromUrl) return;
  const eventSelect = document.getElementById('eventName');
  const match = Array.from(eventSelect.options).find(
    opt => opt.value.toLowerCase() === eventFromUrl.toLowerCase()
  );
  if(match){
    eventSelect.value = match.value;
    document.getElementById('eventTitle').textContent = match.value;
  } else {
    document.getElementById('eventTitle').textContent = eventFromUrl;
  }
}
applyEventFromUrl();

async function fetchVenueDirectory(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=venues`);
    if(!res.ok) throw new Error('Request failed');
    const sheetVenues = await res.json();
    if(Array.isArray(sheetVenues)){
      sheetVenues.forEach(v => {
        if(!v.name) return;
        VENUE_DIRECTORY[v.name.trim().toLowerCase()] = v.name.trim();
      });
      populateVenueSelect();
      applyEventFromUrl();
    }
  } catch(err){
    // fall back silently to the built-in venue list
  }
}
fetchVenueDirectory();

const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD in local time
document.getElementById('eventDate').value = todayStr;

const nowTimeStr = new Date().toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}); // HH:MM 24hr for <input type=time>
document.getElementById('checkInTime').value = nowTimeStr;

function autofill(nameInput){
  const match = CONTACTS_BY_NAME[nameInput.value.trim().toLowerCase()];
  if(match){
    document.getElementById('personLicense').value = match.license || '';
    document.getElementById('personPhone').value = match.phone || '';
    document.getElementById('personAddress').value = match.address || '';
  }
}

function checkIn(){
  const eventName = document.getElementById('eventName').value.trim();
  const name = document.getElementById('personName').value.trim();
  const msg = document.getElementById('msg');

  if(!eventName || !name){
    msg.textContent = 'Enter the event and your name before checking in.';
    msg.className = 'msg err';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Checking in…';

  const payload = {
    event: eventName,
    eventDate: document.getElementById('eventDate').value,
    checkInTime: document.getElementById('checkInTime').value,
    name: name,
    license: document.getElementById('personLicense').value.trim(),
    phone: document.getElementById('personPhone').value.trim(),
    address: document.getElementById('personAddress').value.trim(),
    age: document.getElementById('personAge').value.trim()
  };

  fetch(CHECKIN_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('formBody').innerHTML = `
      <div class="success">
        <div class="check">&#10003;</div>
        <h2>You're checked in</h2>
        <p>${name} — ${eventName}</p>
      </div>`;
  }).catch(() => {
    msg.textContent = 'Could not check in — check your connection and try again.';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'Check in';
  });
}
</script>
</body>
</html>
