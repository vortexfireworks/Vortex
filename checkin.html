<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Check-In — Vortex Productions</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --accent1:#d92b2b; --accent2:#ff8c00; --accent3:#ffd23f; --accent4:#2f7ec9; --accent5:#123a63;
    --ink:#f4f1ea; --ink-soft:#a3a9bf; --line:rgba(255,255,255,0.1);
    --card:rgba(22,28,48,0.75); --ok:#4caf7d; --err:#ff6a5a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #16233f 0%, #0a0f1e 55%, #05070f 100%);
    color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    padding:32px 16px;
  }
  .card{
    max-width:440px; width:100%;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
    backdrop-filter:blur(6px);
  }
  header{
    background:rgba(10,14,26,0.5); color:var(--ink);
    padding:22px 24px; border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg,var(--accent1),var(--accent2) 35%,var(--accent3) 55%,var(--accent4) 80%,var(--accent5)) 1;
    display:flex; align-items:center; gap:14px;
  }
  header img{width:44px;height:44px;flex-shrink:0;border-radius:8px;background:#fff;}
  header .kicker{font-size:11px;letter-spacing:.08em;color:#ffb98a;margin:0 0 4px;font-weight:700;text-transform:uppercase;}
  header h1{margin:0;font-size:19px;font-weight:700;line-height:1.3;}
  .body{padding:24px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
  label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  input[type=text],input[type=number],input[type=date],input[type=time],select{
    font-size:15px;padding:10px 12px;border:1px solid var(--line);
    border-radius:6px;background:rgba(10,14,26,0.6);color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:#ff8c00;box-shadow:0 0 0 2px rgba(255,140,0,0.2);}
  input[readonly]{background:rgba(255,255,255,0.04);color:var(--ink-soft);}
  button.primary{
    width:100%; color:#fdf6f2; border:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    font-size:15px; font-weight:700; padding:13px 16px; border-radius:8px; cursor:pointer;
    box-shadow:0 0 18px rgba(255,140,0,0.3);
  }
  button.primary:disabled{opacity:.6;cursor:default;box-shadow:none;}
  button.primary:hover:not(:disabled){filter:brightness(1.1);}
  .msg{font-size:13px;margin-top:14px;text-align:center;}
  .msg.ok{color:var(--ok);}
  .msg.err{color:var(--err);}
  .success{
    padding:40px 24px;text-align:center;
  }
  .success .check{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--ok),#2f7ec9);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:28px;margin:0 auto 16px;
    box-shadow:0 0 20px rgba(76,175,125,0.4);
  }
  .success h2{margin:0 0 6px;font-size:18px;color:var(--ink);}
  .success p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .back-link{
    display:block; max-width:440px; margin:0 auto 12px; padding:0 4px;
    font-size:12.5px; color:var(--ink-soft); text-decoration:none;
  }
  .back-link:hover{color:#ffb98a;}
</style>
</head>
<body>

<div style="max-width:440px;width:100%;">
<a class="back-link" href="index.html">&larr; Back to main menu</a>
<div class="card">
  <header>
    <img src="logo.jpg" alt="Vortex Fireworks Artists logo">
    <div>
      <p class="kicker">VORTEX PRODUCTIONS INC.</p>
      <h1 id="eventTitle">Event Check-In</h1>
    </div>
  </header>
  <div class="body" id="formBody">
    <div class="field">
      <label for="eventName">Event / venue</label>
      <select id="eventName">
        <option value="" disabled selected>Select a venue…</option>
      </select>
    </div>
    <div class="field">
      <label for="eventDate">Date of event</label>
      <input type="date" id="eventDate">
    </div>
    <div class="field">
      <label for="checkInTime">Time</label>
      <input type="time" id="checkInTime">
    </div>
    <div class="field">
      <label for="personName">Your name</label>
      <input type="text" id="personName" list="contactsList" oninput="autofill(this)" autocomplete="off">
      <datalist id="contactsList"></datalist>
    </div>
    <div class="field">
      <label for="personLicense">License number</label>
      <input type="text" id="personLicense">
    </div>
    <div class="field">
      <label for="personPhone">Phone number</label>
      <input type="text" id="personPhone" oninput="checkPhoneMatch()">
      <p style="font-size:11px;color:var(--ink-soft);margin:4px 0 0;">Enter the phone number on file to auto-fill your license, address, and age.</p>
    </div>
    <div class="field">
      <label for="personAddress">Address</label>
      <input type="text" id="personAddress">
    </div>
    <div class="field">
      <label for="personAge">Age</label>
      <input type="text" id="personAge">
    </div>
    <button class="primary" id="submitBtn" onclick="checkIn()">Check in</button>
    <p class="msg" id="msg"></p>
  </div>
</div>
</div>

<script>
const CHECKIN_API_URL = "https://script.google.com/macros/s/AKfycbyh2E21uM3TooJlwllIOL4BfoHkcAnlNautV4zcpZpj2lEUnq66oDDN6TfUiaTbXgMsrQ/exec";

// Only names are ever kept in the browser — license/address/age/phone are
// looked up on the server, and only released after a matching phone number
// is entered for that exact name. See checkPhoneMatch().
async function fetchNameList(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=names`);
    if(!res.ok) throw new Error('Request failed');
    const names = await res.json();
    if(Array.isArray(names)){
      document.getElementById('contactsList').innerHTML =
        names.map(n => `<option value="${String(n).replace(/"/g,'&quot;')}">`).join('');
    }
  } catch(err){
    // fall back silently — manual entry still works even if this fails
  }
}
fetchNameList();

const VENUE_DIRECTORY = {};
[
  "Real Salt Lake","University of Utah","Salt Lake Bees","Trailer Loading","Shop Time","Bunker Time",
  "Hillcrest High School","Jordan High School","Copper Hills High School","Herriman High School",
  "North Ridge High School","Bee's - Class \"C\" Show","West Jordan High School","American Heritage High School",
  "Sleepy Ridge","Mountain Ridge High School","Stansbury High School","Bingham High School","Bluffdale City",
  "Midvale City","Utah Valley University","Southeast Township Days","Magna - Day 1","Magna - Day 2",
  "Murray City","Ogden Raptors","Farr West","West Point","Moab - 4th of July","Dutch John",
  "Weber State University","Draper City","Bountiful City","American Fork City","Lehi City","Springville City",
  "West Valley City (West Fest)","Clinton City","Thanksgiving Point Waterfall Concert","Dugway City",
  "Taylorsville - Thursday","Taylorsville - Friday","Taylorsville - Saturday","Olympus High School","Moab - Music Festival"
].forEach(name => { VENUE_DIRECTORY[name.toLowerCase()] = name; });

function populateVenueSelect(){
  const select = document.getElementById('eventName');
  const currentValue = select.value;
  const sortedNames = Object.values(VENUE_DIRECTORY).sort((a,b) => a.localeCompare(b));
  select.innerHTML = '<option value="" disabled>Select a venue…</option>' +
    sortedNames.map(name => `<option value="${name.replace(/"/g,'&quot;')}">${name}</option>`).join('');
  if(currentValue){
    select.value = currentValue;
  } else {
    select.selectedIndex = 0;
  }
}
populateVenueSelect();

function applyEventFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const eventFromUrl = params.get('event') || '';
  if(!eventFromUrl) return;
  const eventSelect = document.getElementById('eventName');
  const match = Array.from(eventSelect.options).find(
    opt => opt.value.toLowerCase() === eventFromUrl.toLowerCase()
  );
  if(match){
    eventSelect.value = match.value;
    document.getElementById('eventTitle').textContent = match.value;
  } else {
    document.getElementById('eventTitle').textContent = eventFromUrl;
  }
}
applyEventFromUrl();

async function fetchVenueDirectory(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=venues`);
    if(!res.ok) throw new Error('Request failed');
    const sheetVenues = await res.json();
    if(Array.isArray(sheetVenues)){
      sheetVenues.forEach(v => {
        if(!v.name) return;
        VENUE_DIRECTORY[v.name.trim().toLowerCase()] = v.name.trim();
      });
      populateVenueSelect();
      applyEventFromUrl();
    }
  } catch(err){
    // fall back silently to the built-in venue list
  }
}
fetchVenueDirectory();

const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD in local time
document.getElementById('eventDate').value = todayStr;

const nowTimeStr = new Date().toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}); // HH:MM 24hr for <input type=time>
document.getElementById('checkInTime').value = nowTimeStr;

function autofill(nameInput){
  // Don't reveal license/address/age just from typing a name.
  // Those only unlock once the correct phone number is entered below.
  document.getElementById('personLicense').value = '';
  document.getElementById('personAddress').value = '';
  document.getElementById('personAge').value = '';
  checkPhoneMatch();
}

function normalizePhoneDigits(str){
  return (str || '').replace(/\D/g, '');
}

let phoneCheckTimer = null;
let phoneCheckToken = 0;

function checkPhoneMatch(){
  clearTimeout(phoneCheckTimer);
  const enteredPhone = normalizePhoneDigits(document.getElementById('personPhone').value);
  if(enteredPhone.length < 7){
    document.getElementById('personLicense').value = '';
    document.getElementById('personAddress').value = '';
    document.getElementById('personAge').value = '';
    return;
  }
  phoneCheckTimer = setTimeout(verifyPhoneWithServer, 450);
}

async function verifyPhoneWithServer(){
  const name = document.getElementById('personName').value.trim();
  const phone = document.getElementById('personPhone').value.trim();
  if(!name || !phone) return;
  const myToken = ++phoneCheckToken;
  try{
    const url = `${CHECKIN_API_URL}?type=verifyPerson&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`;
    const res = await fetch(url);
    if(!res.ok) return;
    const data = await res.json();
    if(myToken !== phoneCheckToken) return; // a newer keystroke already superseded this check
    if(data && data.verified){
      document.getElementById('personLicense').value = data.license || '';
      document.getElementById('personAddress').value = data.address || '';
      document.getElementById('personAge').value = data.age || '';
    } else {
      document.getElementById('personLicense').value = '';
      document.getElementById('personAddress').value = '';
      document.getElementById('personAge').value = '';
    }
  } catch(err){
    // silent fail — the person can still fill everything in manually
  }
}

function checkIn(){
  const eventName = document.getElementById('eventName').value.trim();
  const name = document.getElementById('personName').value.trim();
  const msg = document.getElementById('msg');

  if(!eventName || !name){
    msg.textContent = 'Enter the event and your name before checking in.';
    msg.className = 'msg err';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Checking in…';

  const payload = {
    event: eventName,
    eventDate: document.getElementById('eventDate').value,
    checkInTime: document.getElementById('checkInTime').value,
    name: name,
    license: document.getElementById('personLicense').value.trim(),
    phone: document.getElementById('personPhone').value.trim(),
    address: document.getElementById('personAddress').value.trim(),
    age: document.getElementById('personAge').value.trim()
  };

  fetch(CHECKIN_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('formBody').innerHTML = `
      <div class="success">
        <div class="check">&#10003;</div>
        <h2>You're checked in</h2>
        <p>${name} — ${eventName}</p>
      </div>`;
  }).catch(() => {
    msg.textContent = 'Could not check in — check your connection and try again.';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'Check in';
  });
}
</script>
</body>
</html>
