<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pyro Tools">
<script>
  (function(){
    try{
      var saved = localStorage.getItem('pyroTheme');
      var wantLight;
      if(saved === 'light' || saved === 'dark'){
        wantLight = (saved === 'light');
      } else {
        // No explicit choice yet — follow the phone/browser's system setting.
        // Default to dark unless the system explicitly prefers light.
        wantLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      }
      if(wantLight){
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch(e){}
  })();
</script>
<style>
  :root{
    --surface-55:rgba(10,14,26,0.55); --bg1:#16233f; --bg2:#0a0f1e; --bg3:#05070f;
    --ink:#f4f1ea; --ink-soft:#a3a9bf; --ink-faint:#6b7290;
    --card-bg:rgba(22,28,48,0.7); --card-border:rgba(255,255,255,0.08);
    --surface:var(--surface-55); --surface-border:rgba(255,255,255,0.15);
    --divider-glow:rgba(255,140,0,0.4);
    --logo-ring-bg:#0d1220;
    --footer-link:#4a5170;
    --feature-bg:rgba(255,255,255,0.04); --feature-border:rgba(255,255,255,0.08); --feature-ink:#7d84a0;
    --kicker:#ffb98a; --tagline:#a6acc4;
    --bubble-bg:#fdfcfa; --bubble-ink:#1c1a17; --bubble-border:transparent;
    --title-gradient:linear-gradient(90deg,#ff6a5a 0%,#ff8c00 30%,#ffd23f 50%,#5a9de0 75%,#7fa8e8 100%);
    --burst-opacity:0.4; --watermark-opacity:0.07;
  }
  :root[data-theme="light"]{
    --surface-55:rgba(255,255,255,0.65); --bg1:#fdf3e7; --bg2:#f7ead9; --bg3:#f0e0c9;
    --ink:#241f18; --ink-soft:#6b6152; --ink-faint:#8a8072;
    --card-bg:rgba(255,255,255,0.75); --card-border:rgba(36,31,24,0.1);
    --surface:rgba(255,255,255,0.6); --surface-border:rgba(36,31,24,0.15);
    --divider-glow:rgba(255,140,0,0.3);
    --logo-ring-bg:#fffaf3;
    --footer-link:#a68a5c;
    --feature-bg:rgba(36,31,24,0.035); --feature-border:rgba(36,31,24,0.1); --feature-ink:#8a7c68;
    --kicker:#c9601f; --tagline:#6b6152;
    --bubble-bg:#ffffff; --bubble-ink:#1c1a17; --bubble-border:rgba(255,140,0,0.35);
    --title-gradient:linear-gradient(90deg,#d92b2b 0%,#e26a00 30%,#c98a00 50%,#2f7ec9 75%,#123a63 100%);
    --burst-opacity:0.16; --watermark-opacity:0.04;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    display:flex; align-items:flex-start; justify-content:center;
    padding:48px 16px;
    overflow-x:hidden;
    position:relative;
    transition:background 0.25s ease, color 0.25s ease;
  }
  .burst{
    position:absolute; border-radius:50%;
    filter: blur(2px);
    opacity:var(--burst-opacity);
    pointer-events:none;
  }
  .v-watermark{
    position:absolute; top:-30px; right:-50px;
    width:300px;height:340px;
    opacity:var(--watermark-opacity);
    background:linear-gradient(160deg, #d92b2b, #ff8c00 30%, #ffd23f 50%, #2f7ec9 75%, #123a63);
    clip-path:polygon(0 0, 100% 0, 55% 100%, 45% 100%);
    pointer-events:none;
    filter:blur(1px);
  }
  .wrap{max-width:440px;width:100%;position:relative;z-index:2;}
  header{text-align:center;margin-bottom:12px;}
  .logo-ring{
    width:104px;height:104px;border-radius:50%;
    padding:3px;
    background:linear-gradient(140deg,#d92b2b,#ff8c00 35%,#ffd23f 55%,#2f7ec9 75%,#123a63);
    margin:0 auto 18px;
    box-shadow:0 0 40px rgba(255,140,0,0.35), 0 0 70px rgba(47,126,201,0.25);
  }
  .logo-ring-inner{
    width:100%;height:100%;border-radius:50%;
    background:var(--logo-ring-bg);
    display:flex;align-items:center;justify-content:center;
  }
  .logo-ring img{width:82px;height:82px;border-radius:50%;object-fit:cover;}
  .kicker{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--kicker);font-weight:700;margin-bottom:6px;
  }
  h1{
    font-size:27px;font-weight:800;letter-spacing:-0.02em;
    background:var(--title-gradient);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1.15;
  }
  .tagline{
    font-family:Georgia,"Times New Roman",serif; font-style:italic;
    font-size:14px; color:var(--tagline); margin-top:6px;
  }
  .divider{
    height:3px;width:64px;margin:22px auto 26px;
    background:linear-gradient(90deg,#d92b2b,#ff8c00 35%,#ffd23f 55%,#2f7ec9 80%,#123a63);
    border-radius:2px;
    box-shadow:0 0 12px rgba(255,140,0,0.4);
  }
  .cards{
    display:flex; flex-wrap:wrap; justify-content:center; gap:28px 18px;
    max-width:420px; margin:0 auto;
  }
  .card{
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
    text-decoration:none;color:inherit;
    width:26%;
    transition:transform .15s ease;
  }
  .card:hover{transform:translateY(-2px);}
  .icon-circle{
    width:58px;height:58px;border-radius:18px;flex-shrink:0;
    background:var(--grad);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px var(--glow);
  }
  .icon-circle svg{width:29px;height:29px;}
  .card .label{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.3;}
  .card .ext{font-size:10px;color:var(--kicker);font-weight:700;}
  .c1{--grad:linear-gradient(135deg,#d92b2b,#ff8c00); --glow:rgba(255,140,0,0.4);}
  .c2{--grad:linear-gradient(135deg,#2f7ec9,#123a63); --glow:rgba(47,126,201,0.4);}
  .c3{--grad:linear-gradient(135deg,#ff8c00,#ffd23f); --glow:rgba(255,210,63,0.4);}
  footer{
    margin-top:32px;text-align:center;font-size:11px;color:var(--ink-faint);
  }
  footer .brand{
    font-weight:700;
    background:linear-gradient(90deg,#ff8c5a,#ff8c00 40%,#5a9de0 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  footer a:hover{color:var(--ink-soft) !important;}

  .announcement-bubble{
    display:none; max-width:420px; margin:0 auto 22px; position:relative;
    background:var(--bubble-bg);
    border:1px solid var(--bubble-border);
    border-radius:18px 18px 18px 4px;
    padding:16px 36px 16px 18px; font-size:13.5px; line-height:1.5; color:var(--bubble-ink);
    font-weight:700; text-align:center;
    box-shadow:0 10px 28px rgba(0,0,0,0.35);
    animation:bubbleIn 0.35s ease both;
  }
  .announcement-bubble .icon{font-size:15px;margin-right:6px;}
  @keyframes bubbleIn{
    0%{opacity:0; transform:translateY(-8px);}
    100%{opacity:1; transform:translateY(0);}
  }
  .announcement-bubble .close-btn{
    position:absolute; top:8px; right:10px; background:none; border:none;
    color:#8a8478; font-size:18px; line-height:1; cursor:pointer; padding:4px;
  }
  .announcement-bubble .close-btn:hover{color:#1c1a17;}

  .admin-lock{
    max-width:420px; margin:20px auto 0; text-align:center;
  }
  .admin-lock summary{
    cursor:pointer; font-size:11px; color:var(--footer-link); list-style:none; user-select:none;
  }
  .admin-lock summary::-webkit-details-marker{display:none;}
  .admin-lock summary:hover{color:var(--ink-soft);}
  .admin-panel{
    margin-top:10px; background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:10px; padding:16px; text-align:left;
  }
  .admin-panel input[type=password], .admin-panel textarea{
    width:100%; font-size:13px; padding:9px 11px; border:1px solid var(--surface-border);
    border-radius:6px; background:var(--surface); color:var(--ink); font-family:inherit;
    box-sizing:border-box;
  }
  .admin-panel textarea{resize:vertical;min-height:60px;}
  .admin-panel button{
    margin-top:8px; background:linear-gradient(135deg,#d92b2b,#ff8c00); color:#fdf6f2;
    border:none; font-size:12.5px; font-weight:700; padding:9px 16px; border-radius:6px; cursor:pointer;
  }
  .admin-panel .existing-item{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    padding:8px 0; border-top:1px solid var(--card-border); font-size:12px; color:var(--ink-soft);
  }
  .admin-panel .existing-item button{
    margin:0; background:none; border:1px solid rgba(255,106,90,0.4); color:#ff6a5a;
    font-size:11px; font-weight:400; padding:3px 8px;
  }
  .theme-toggle{
    position:absolute; top:12px; right:12px; z-index:5;
    width:36px;height:36px;border-radius:50%;
    background:var(--card-bg); border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;
    font-size:16px; cursor:pointer;
    transition:transform 0.15s ease;
  }
  .theme-toggle:hover{transform:scale(1.08);}
</style>
</head>

      <button type="button" onclick="checkAdminPassword()">Unlock</button>

      <button type="button" onclick="postAnnouncement()">Post announcement</button>
      <p id="postStatus" style="font-size:11.5px;margin-top:8px;"></p>

<script>
const CHECKIN_API_URL = "https://script.google.com/macros/s/AKfycbyh2E21uM3TooJlwllIOL4BfoHkcAnlNautV4zcpZpj2lEUnq66oDDN6TfUiaTbXgMsrQ/exec";
const ADMIN_PASSWORD_HASH = "cf7c3f3c216f72e7b13203c30ff418dfff1206d08139fe52411603eeda3aedb2";
let ANNOUNCEMENTS = [];

function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('pyroTheme', 'dark'); } catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    try{ localStorage.setItem('pyroTheme', 'light'); } catch(e){}
  }
  updateThemeToggleIcon();
}

function updateThemeToggleIcon(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.getElementById('themeToggleIcon').textContent = isLight ? '🌙' : '☀️';
}
updateThemeToggleIcon();

async function sha256Hex(text){
  const data = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function loadAnnouncements(){
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=announcements`);
    if(!res.ok) return;
    ANNOUNCEMENTS = await res.json();
    showLatestAnnouncement();
    renderExistingAnnouncements();
  } catch(err){
    // fail silently — announcements are a nice-to-have, not core functionality
  }
}

function showLatestAnnouncement(){
  if(!ANNOUNCEMENTS || ANNOUNCEMENTS.length === 0) return;
  const latest = ANNOUNCEMENTS[0];
  const dismissedTimestamp = localStorage.getItem('dismissedAnnouncementTimestamp');
  if(dismissedTimestamp === latest.timestamp) return;
  document.getElementById('announcementText').textContent = latest.message;
  document.getElementById('announcementBubble').style.display = 'block';
  document.getElementById('announcementBubble').dataset.timestamp = latest.timestamp;
}

function dismissAnnouncement(){
  const bubble = document.getElementById('announcementBubble');
  localStorage.setItem('dismissedAnnouncementTimestamp', bubble.dataset.timestamp || '');
  bubble.style.display = 'none';
}

async function checkAdminPassword(){
  const entered = document.getElementById('adminPassword').value;
  const hash = await sha256Hex(entered);
  if(hash === ADMIN_PASSWORD_HASH){
    document.getElementById('adminLoginPanel').style.display = 'none';
    document.getElementById('adminEditPanel').style.display = 'block';
  } else {
    document.getElementById('adminLoginError').style.display = 'block';
    document.getElementById('adminPassword').value = '';
  }
}

function postAnnouncement(){
  const textEl = document.getElementById('newAnnouncementText');
  const message = textEl.value.trim();
  const statusEl = document.getElementById('postStatus');
  if(!message){
    statusEl.textContent = 'Type something before posting.';
    statusEl.style.color = '#ff6a5a';
    return;
  }
  statusEl.textContent = 'Posting…';
  statusEl.style.color = '#a3a9bf';
  fetch(CHECKIN_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ recordType: 'announcement', message })
  }).then(async () => {
    textEl.value = '';
    statusEl.textContent = 'Posted.';
    statusEl.style.color = '#4caf7d';
    await loadAnnouncements();
  }).catch(() => {
    statusEl.textContent = 'Could not post — check your connection and try again.';
    statusEl.style.color = '#ff6a5a';
  });
}

function renderExistingAnnouncements(){
  const wrap = document.getElementById('existingAnnouncementsList');
  if(!ANNOUNCEMENTS || ANNOUNCEMENTS.length === 0){
    wrap.innerHTML = '<p style="font-size:11.5px;color:#6b7290;">No announcements posted yet.</p>';
    return;
  }
  wrap.innerHTML = ANNOUNCEMENTS.map(a => `
    <div class="existing-item">
      <span>${a.message.replace(/</g,'&lt;')}</span>
      <button type="button" onclick="deleteAnnouncement(${a.rowNumber})">Delete</button>
    </div>
  `).join('');
}

function deleteAnnouncement(rowNumber){
  if(!confirm('Delete this announcement?')) return;
  fetch(CHECKIN_API_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ recordType: 'deleteAnnouncementRow', rowNumber })
  }).then(() => loadAnnouncements());
}

loadAnnouncements();
</script>
