<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="auth.js"></script>
<script>Auth.require('admin');</script>
<title>Tasks — CueSheet</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="CueSheet">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" href="icon-192.png">
<script>
function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('pyroTheme', 'dark'); } catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    try{ localStorage.setItem('pyroTheme', 'light'); } catch(e){}
  }
  updateThemeToggleIcon();
}
function updateThemeToggleIcon(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const el = document.getElementById('themeToggleIcon');
  if(el) el.textContent = isLight ? '🌙' : '☀️';
}
updateThemeToggleIcon();

  (function(){
    try{
      var saved = localStorage.getItem('pyroTheme');
      var wantLight;
      if(saved === 'light' || saved === 'dark'){
        wantLight = (saved === 'light');
      } else {
        wantLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      }
      if(wantLight){
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch(e){}
  })();
</script>
<style>
  :root{
    --kicker:#ffb98a; --surface-4:rgba(10,14,26,0.4); --surface-5:rgba(10,14,26,0.5); --surface-55:rgba(10,14,26,0.55); --bg1:#16233f; --bg2:#0a0f1e; --bg3:#05070f;
    --logo-ring-bg:#0d1220;
    --navy:#ffb98a; --brick:#ff6a5a; --brick-light:#ff8c66;
    --paper:#1a2032; --card:rgba(22,28,48,0.75); --line:rgba(255,255,255,0.12);
    --ink:#f4f1ea; --ink-soft:#a3a9bf; --ok:#4caf7d;
    --accent1:#d92b2b; --accent2:#ff8c00;
  }
  :root[data-theme="light"]{
    --kicker:#c9601f; --surface-4:rgba(255,255,255,0.5); --surface-5:rgba(255,255,255,0.6); --surface-55:rgba(255,255,255,0.65); --bg1:#fdf3e7; --bg2:#f7ead9; --bg3:#f0e0c9; --ink:#241f18; --ink-soft:#6b6152; --card:rgba(255,255,255,0.78); --line:rgba(36,31,24,0.12); --paper:#fdf3e7; --navy:#c9601f;
    --logo-ring-bg:#fffaf3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: radial-gradient(ellipse at 50% -10%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%); color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;
    padding:32px 16px 80px;
    min-height:100vh;
  }
  .sheet{max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;backdrop-filter:blur(6px);}
  header{text-align:center;margin-bottom:12px;}
  .logo-ring{width:92px;height:92px;border-radius:50%;padding:3px;background:linear-gradient(140deg,#d92b2b,#ff8c00 35%,#ffd23f 55%,#2f7ec9 75%,#123a63);margin:0 auto 16px;box-shadow:0 0 34px rgba(255,140,0,0.35), 0 0 60px rgba(47,126,201,0.25);}
  .logo-ring-inner{width:100%;height:100%;border-radius:50%;background:var(--logo-ring-bg);display:flex;align-items:center;justify-content:center;}
  .logo-ring img{width:72px;height:72px;border-radius:50%;object-fit:cover;}
  header .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--kicker);font-weight:700;margin-bottom:6px;}
  header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(90deg,#ff6a5a 0%,#ff8c00 30%,#ffd23f 50%,#5a9de0 75%,#7fa8e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15;}
  .divider{height:3px;width:64px;margin:20px auto 24px;background:linear-gradient(90deg,#d92b2b,#ff8c00 35%,#ffd23f 55%,#2f7ec9 80%,#123a63);border-radius:2px;box-shadow:0 0 12px rgba(255,140,0,0.4);}
  .section{padding:22px 24px;}
  .section p.desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.5;}
  .back-link{display:block; max-width:640px; margin:16px auto 0; padding:0 16px;font-size:12.5px; color:var(--ink-soft); text-decoration:none;}
  .back-link:hover{color:var(--navy);}
  .empty-state{text-align:center; padding:30px 12px; color:var(--ink-soft);}
  .empty-state .icon{font-size:30px;margin-bottom:10px;opacity:0.7;}
  .empty-state p{margin:0;font-size:14px;font-weight:600;color:var(--ok);}
  .theme-toggle{
    position:fixed; top:14px; right:14px; z-index:50;
    width:36px;height:36px;border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:16px; cursor:pointer;
    transition:transform 0.15s ease;
  }
  .theme-toggle:hover{transform:scale(1.08);}

  .task-group{margin-bottom:22px;}
  .task-group:last-child{margin-bottom:0;}
  .task-group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .task-group-head h2{margin:0;font-size:14.5px;font-weight:700;}
  .task-count{
    font-size:11px;font-weight:700;background:rgba(255,140,0,0.18);color:var(--brick-light);
    padding:2px 9px;border-radius:10px;
  }
  .task-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .task-row{
    padding:11px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;gap:10px;font-size:13px;
  }
  .task-row:first-child{border-top:none;}
  .task-row .who{font-weight:600;color:var(--ink);}
  .task-row .what{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .task-row .when{font-size:11.5px;color:var(--ink-soft);flex-shrink:0;white-space:nowrap;}
  .task-link{
    display:inline-block;margin-top:10px;font-size:12px;color:var(--navy);text-decoration:none;
    border:1px solid var(--line);padding:6px 12px;border-radius:8px;
  }
  .task-link:hover{border-color:var(--navy);}
  .task-group-empty{font-size:12px;color:var(--ink-soft);padding:10px 2px;}
</style>
</head>
<body>
<button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Switch theme"><span id="themeToggleIcon">☀️</span></button>

<a class="back-link" href="manage.html">&larr; Back to Manage/Edit</a>

<header>
  <div class="logo-ring"><div class="logo-ring-inner"><img src="logo.jpg" alt="Vortex Fireworks Artists logo"></div></div>
  <p class="kicker">Vortex Productions Inc.</p>
  <h1>Tasks</h1>
</header>

<div class="divider"></div>

<div class="sheet">
  <div class="section">
    <p class="desc">Everything across the app that's waiting on a decision right now.</p>
    <div id="tasksWrap"><div class="empty-state"><div class="icon">⏳</div><p style="color:var(--ink-soft);font-weight:400;">Loading…</p></div></div>
  </div>
</div>

<script>
const CHECKIN_API_URL = "https://script.google.com/macros/s/AKfycbxHGsAnuVvfdr5O0-lC7U01tCclhAVIrrGEwLfVoaa142YYGU0OyX1tBCiK1nGOqf_n8A/exec";

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatEventDate(d){
  if(!d) return 'No date set';
  const p = String(d).slice(0,10).split('-');
  if(p.length !== 3) return d;
  return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function formatRequestedAt(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}

async function loadTasks(){
  const wrap = $('tasksWrap');
  let tasks;
  try{
    const res = await fetch(`${CHECKIN_API_URL}?type=pendingTasksSummary`, { cache: 'no-store' });
    tasks = await res.json();
  } catch(err){
    wrap.innerHTML = '<p style="font-size:13px;color:var(--brick);">Could not load tasks — check your connection and try again.</p>';
    return;
  }
  if(!tasks || !tasks.totalCount){
    wrap.innerHTML = '<div class="empty-state"><div class="icon">✅</div><p>Nothing needs your attention right now.</p></div>';
    return;
  }

  const groups = [];

  groups.push(taskGroupHtml(
    'Shows needing a Head Pyro', tasks.venuesNeedHp,
    v => `<div class="task-row"><div><div class="who">${esc(v.name)}</div></div><div class="when">${esc(formatEventDate(v.eventDate))}</div></div>`,
    'venues.html', 'Open Venues'
  ));

  groups.push(taskGroupHtml(
    'Payroll pending approval', tasks.payrollNeedsApproval,
    r => `<div class="task-row"><div><div class="who">${esc(r.event || 'Show')}</div></div><div class="when">${esc(formatEventDate(r.eventDate))}</div></div>`,
    'payroll-reports.html', 'Open Payroll Reports'
  ));

  groups.push(taskGroupHtml(
    'Photos waiting on review', tasks.photoWallPending,
    p => `<div class="task-row"><div><div class="who">${esc(p.name || 'Anonymous')}</div>${p.caption ? `<div class="what">${esc(p.caption)}</div>` : ''}</div></div>`,
    'manage-photo-wall.html', 'Open Photo Wall'
  ));

  groups.push(taskGroupHtml(
    'Google sign-ins waiting on access', tasks.accessRequests,
    r => `<div class="task-row"><div><div class="who">${esc(r.name || r.email)}</div><div class="what">${esc(r.email)}</div></div><div class="when">${esc(formatRequestedAt(r.firstRequestedAt))}</div></div>`,
    'manage-access.html', 'Open Manage Access'
  ));

  wrap.innerHTML = groups.join('');
}

function taskGroupHtml(title, items, rowFn, href, linkLabel){
  if(!items || !items.length) return '';
  return `
    <div class="task-group">
      <div class="task-group-head">
        <h2>${esc(title)}</h2>
        <span class="task-count">${items.length}</span>
      </div>
      <div class="task-list">${items.map(rowFn).join('')}</div>
      <a class="task-link" href="${href}">${esc(linkLabel)} &rarr;</a>
    </div>`;
}

loadTasks();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => {});
    }).catch(() => {});
  });
  let swRefreshedOnce = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshedOnce) return;
    swRefreshedOnce = true;
    location.reload();
  });
}
</script>
</body>
</html>
